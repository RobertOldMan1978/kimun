<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VULPO · Profesores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Titan+One&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#ffc93c;--cyan:#4dd8ff;--green:#3ee089;--pink:#ff4d8d;--violet:#8f6bff;
 --dim:#a89fd6;--panel:#241d4e}
*{box-sizing:border-box}
body{margin:0;background:#140f33;color:#fff;font-family:Nunito,sans-serif;font-weight:800;
 padding:16px;max-width:480px;margin:0 auto}
h1{font-family:'Titan One',cursive;color:var(--gold);font-size:28px;text-align:center;margin:12px 0}
.card{background:var(--panel);border:2px solid #ffffff14;border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:16px;color:var(--cyan)}
input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--violet);
 background:#1a1440;color:#fff;font-weight:800;margin-bottom:10px;font-family:inherit}
.btn{width:100%;padding:13px;border:0;border-radius:14px;background:var(--gold);color:#2a1c00;
 font-family:inherit;font-weight:900;font-size:15px;cursor:pointer;margin-bottom:8px}
.btn.sec{background:var(--violet);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.msg{text-align:center;font-size:13px;margin-top:8px;min-height:18px}
.hide{display:none}
code{color:var(--cyan);font-weight:900}
/* El triángulo por omisión del desplegable se oculta: la fila del mapa ya se ve
   pulsable, y en WebKit "list-style:none" por sí solo no lo quita. */
.oa-fila>summary::-webkit-details-marker{display:none}

/* Filas de curso y de alumno, en dos líneas. En un teléfono de 375 px el nombre, el
   código, el XP y los botones no caben en la misma fila: el nombre no podía encogerse
   (flex:1 sin min-width:0) y el panel entero se desplazaba de lado. */
.cur-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cur-nom,.alu-nom,.pro-nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap}
.alu{padding:6px 0;border-bottom:1px solid #ffffff14}
.alu-top{display:flex;align-items:center;gap:6px}
.alu-sub{font-size:12px;color:var(--dim);margin-top:2px}
/* Área tocable de verdad: los botones de 21×25 px se fallaban con el dedo. */
.ico{background:none;border:0;font-family:inherit;font-weight:900;font-size:15px;
 line-height:1;cursor:pointer;padding:0;min-width:38px;height:38px;border-radius:10px;
 color:var(--cyan)}
.ico:active{background:#ffffff1a}
/* Borrar se aparta del resto: es lo único que no se puede deshacer. */
.ico-del{color:var(--pink);margin-left:12px}
.btn-chip{background:none;border:2px solid var(--violet);color:var(--cyan);
 font-family:inherit;font-weight:900;font-size:13px;padding:8px 12px;border-radius:12px;
 cursor:pointer;margin-bottom:6px}

/* Encabezado pegado arriba: con 60 objetivos, saber de qué curso es la tabla y volver
   al panel exigía subir miles de píxeles. */
.av-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;
 background:var(--panel);padding:10px 0;margin:0 0 8px;border-bottom:1px solid #ffffff22}
.av-head-tit{color:var(--gold);font-size:15px;display:block;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.av-head-sub{color:var(--dim);font-size:11px}
.av-filtros{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.av-chip{background:none;border:2px solid #ffffff22;color:var(--dim);font-family:inherit;
 font-weight:900;font-size:12px;padding:7px 12px;border-radius:20px;cursor:pointer}
.av-chip.on{border-color:var(--cyan);color:var(--cyan)}
/* Dos líneas por objetivo: los textos del currículum llegan a 250 caracteres, y con el
   texto entero caben tres por pantalla. Al desplegar la fila se muestra completo. */
.oa-texto{font-size:13px;margin-bottom:4px;display:-webkit-box;-webkit-box-orient:vertical;
 -webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.oa-fila[open] .oa-texto{-webkit-line-clamp:unset;line-clamp:unset;overflow:visible}
#btnArriba{position:fixed;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;
 border:2px solid var(--violet);background:var(--panel);color:var(--cyan);
 font-family:inherit;font-weight:900;font-size:18px;cursor:pointer;z-index:10;opacity:.93}
</style>
</head>
<body>
<h1>VULPO · Profesores</h1>

<div class="card" id="cardAuth">
  <h3 id="authTitulo">Ingresar</h3>
  <input id="correo" type="email" placeholder="Correo" autocomplete="email">
  <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
  <input id="nombre" class="hide" placeholder="Tu nombre">
  <button class="btn" id="btnEntrar">Entrar</button>
  <button class="btn sec" id="btnCambiar">Crear mi cuenta</button>
  <p class="msg" id="authMsg"></p>
</div>

<div class="card hide" id="cardPanel">
  <h3 id="panelTitulo">Mis cursos</h3>
  <div id="lista"></div>
  <p class="msg" id="panelMsg"></p>
  <button class="btn sec" id="btnSalir">Cerrar sesión</button>
</div>

<button id="btnArriba" class="hide" title="Volver arriba" aria-label="Volver arriba">↑</button>

<script>
const SUPA_URL='https://bdgzpjzlqidcexdkjhzy.supabase.co';
const SUPA_KEY='sb_publishable_I3FWEIOQf-_7ni_46PGSSQ_PLD3mQpM';
// storageKey propio: sin esto, la sesión del profesor reemplazaría la del alumno
// que juega en este mismo navegador, y el niño perdería su identidad.
const SB=window.supabase.createClient(SUPA_URL,SUPA_KEY,
  {auth:{storageKey:'kimun-profesor',persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
let MODO='entrar', YO=null;

const ERRORES={
  no_autorizado:'No tienes permiso para esto. Si es tu primera vez, pídele acceso al administrador.',
  sin_sesion:'La sesión se cerró. Vuelve a entrar.',
  sin_correo:'Tu cuenta no tiene un correo confirmado. Revisa el correo de confirmación y vuelve a entrar.',
  correo_invalido:'Ese correo no es válido.',
  profesor_invalido:'Ese profesor no existe.',
  no_te_puedes_quitar:'No puedes quitarte a ti mismo.',
  nombre_vacio:'Escribe un nombre.',
  curso_invalido:'Ese curso no existe.',
  alumno_invalido:'Ese alumno no existe.'
};
// Mensaje del caso más frecuente: la cuenta existe, lo que falta es la autorización.
// Decirle "no tienes permiso" a secas lo manda a revisar su contraseña, que está bien.
const SIN_AUTORIZACION='Tu cuenta se creó, pero tu correo todavía no está autorizado. '+
  'Pídele acceso al administrador y vuelve a entrar.';

function traducir(e){
  // supabase-js trae un código aparte del mensaje; se miran los dos.
  const t=((e&&e.message)||'')+' '+((e&&e.code)||'');
  for(const k in ERRORES) if(t.includes(k)) return ERRORES[k];
  if(t.includes('Invalid login')) return 'Correo o contraseña incorrectos.';
  if(t.includes('already registered')) return 'Ese correo ya tiene cuenta. Usa "Entrar".';
  if(t.includes('at least')) return 'La contraseña debe tener al menos 6 caracteres.';
  // El servicio de correo integrado de Supabase permite 2 envíos por hora, así que
  // esto aparece en cuanto se dan de alta varios profesores seguidos.
  if(t.includes('over_email_send_rate_limit')||t.includes('email rate limit'))
    return 'Supabase ya envió demasiados correos por ahora. Espera un rato y vuelve a intentarlo.';
  if(t.includes('email_address_invalid')) return 'Ese correo no es válido.';
  if(t.includes('Failed to fetch')||t.includes('NetworkError')||t.includes('Load failed'))
    return 'No hay conexión con el servidor. Revisa tu internet y vuelve a intentarlo.';
  if(t.includes('JWT')) return 'La sesión se cerró. Vuelve a entrar.';
  return 'No se pudo completar la acción. Intenta de nuevo.';
}

function esNoAutorizado(e){
  return (((e&&e.message)||'')+' '+((e&&e.code)||'')).includes('no_autorizado');
}

function mostrarIngreso(){
  $('cardPanel').classList.add('hide');
  $('cardAuth').classList.remove('hide');
}

// Un fallo de autorización deja la sesión abierta pero inútil: el botón de cerrar
// sesión vive dentro del panel, que sigue oculto, así que sin esto la persona no
// puede probar con otra cuenta salvo borrando el almacenamiento del navegador.
// Solo se cierra la sesión ante no_autorizado; un corte de red no debe expulsar a nadie.
async function manejarFalloDeIngreso(e){
  if(esNoAutorizado(e)){
    try{ await SB.auth.signOut(); }catch(_){}
    mostrarIngreso();
    aviso(SIN_AUTORIZACION);
    return;
  }
  aviso(traducir(e));
}
function aviso(t,color){
  const el = $('cardPanel').classList.contains('hide') ? $('authMsg') : $('panelMsg');
  el.style.color=color||'var(--pink)'; el.textContent=t;
}
function esc(t){ return String(t==null?'':t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// Dentro del panel, "no autorizado" casi siempre significa que el curso o el alumno
// ya no existe —lo borró otra pestaña, u otro profesor—, no que falten permisos. El
// servidor responde lo mismo en ambos casos a propósito: separarlos permitiría
// descubrir qué códigos existen probándolos uno por uno.
function errorPanel(e){
  return esNoAutorizado(e)
    ? 'No tienes permiso para esto, o el curso o alumno ya no existe.'
    : traducir(e);
}

// Vuelve al panel sin dejar la pantalla en blanco si la lista no se puede cargar.
function volverAlPanel(){
  irArriba();
  pintarLista().catch(e=>aviso(errorPanel(e)));
}

// Cada vista se abre desde arriba. Sin esto, el profesor que pulsa "Ver avance" desde
// el final de una lista de 35 alumnos cae en mitad de la tabla nueva, sin saber de qué
// curso es ni que hay filtros más arriba.
function irArriba(){ window.scrollTo(0,0); }

/* Textos de los objetivos de aprendizaje. El código HI08 OA 01 no le dice nada a
   nadie: sin el texto real, la tabla es ilegible para un profesor. */
const OA_CARPETA = {HI08:'historia-8basico', MA08:'matematicas-8basico',
                    CN08:'ciencias-8basico', LE08:'lenguaje-8basico'};
const OA_TEXTO = {};        // "HI08 OA 01" -> "Analizar, apoyándose en diversas fuentes…"
const OA_CARGADA = {};      // carpetas ya pedidas

async function cargarTextosOA(codigos){
  const carpetas = [...new Set(codigos.map(c => OA_CARPETA[String(c).slice(0,4)]).filter(Boolean))];
  await Promise.all(carpetas.map(async carpeta => {
    if(OA_CARGADA[carpeta]) return;
    OA_CARGADA[carpeta] = true;
    try{
      const r = await fetch('contenido/'+carpeta+'/oa.json');
      if(!r.ok) throw new Error('HTTP '+r.status);
      const d = await r.json();
      (d.oa||[]).forEach(o => { if(o && o.codigo) OA_TEXTO[o.codigo] = o.texto || o.codigo; });
    }catch(e){
      // Si falla, se olvida la marca: de lo contrario un corte momentáneo dejaría a esa
      // asignatura mostrando códigos en vez de textos durante toda la sesión.
      OA_CARGADA[carpeta] = false;
      console.error('OA:', e.message||e);
    }
  }));
}

$('btnCambiar').onclick=()=>{
  MODO = MODO==='entrar' ? 'crear' : 'entrar';
  $('authTitulo').textContent = MODO==='entrar' ? 'Ingresar' : 'Crear mi cuenta';
  $('btnEntrar').textContent  = MODO==='entrar' ? 'Entrar' : 'Crear cuenta';
  $('btnCambiar').textContent = MODO==='entrar' ? 'Crear mi cuenta' : '← Ya tengo cuenta';
  $('nombre').classList.toggle('hide', MODO==='entrar');
  aviso('');
};

$('btnEntrar').onclick=async ()=>{
  const correo=($('correo').value||'').trim(), clave=$('clave').value||'';
  if(!correo||!clave){ aviso('Escribe tu correo y tu contraseña.'); return; }
  $('btnEntrar').disabled=true; aviso('Comprobando…','var(--dim)');
  try{
    if(MODO==='crear'){
      const {data,error}=await SB.auth.signUp({email:correo,password:clave});
      if(error) throw error;
      // Con la confirmación de correo activada, signUp no devuelve sesión.
      if(!data.session){
        aviso('Te enviamos un correo para confirmar tu cuenta. Confírmalo y entra con tu contraseña.','var(--cyan)');
        return;
      }
    }else{
      const {error}=await SB.auth.signInWithPassword({email:correo,password:clave});
      if(error) throw error;
    }
    await asegurarAlta($('nombre').value||'');
    await cargarPanel();
  }catch(e){ await manejarFalloDeIngreso(e); }
  finally{ $('btnEntrar').disabled=false; }
};

$('btnSalir').onclick=async ()=>{ await SB.auth.signOut(); location.reload(); };

// Completa el registro si esta cuenta todavía no tiene fila de profesor. Se llama
// al crear la cuenta Y al iniciar sesión, para que funcione con la confirmación de
// correo activada o desactivada.
async function asegurarAlta(nombre){
  if(await soyProfesor()) return;                   // ya está registrado
  const {error}=await SB.rpc('kimun_prof_alta',{p_nombre:nombre});
  if(error) throw error;
}

// OJO: kimun_prof_yo NO devuelve null para quien no es profesor, devuelve una fila
// con todos los campos vacíos, que en JavaScript es un objeto verdadero. Hay que
// mirar el id: sin esta comprobación, el panel se abre para cualquiera.
async function soyProfesor(){
  const {data,error}=await SB.rpc('kimun_prof_yo');
  // "No se pudo comprobar" no es lo mismo que "no eres profesor": si se traga el
  // error, un corte de red le dice a un profesor legítimo que pida un acceso que
  // ya tiene. Se propaga para que el mensaje diga lo que en verdad pasó.
  if(error) throw error;
  const fila = Array.isArray(data) ? data[0] : data;
  return (fila && fila.id) ? fila : null;
}

async function cargarPanel(){
  YO = await soyProfesor();
  if(!YO){ throw new Error('no_autorizado'); }
  $('cardAuth').classList.add('hide');
  $('cardPanel').classList.remove('hide');
  $('panelTitulo').textContent = YO.es_admin ? 'Todos los cursos' : 'Mis cursos';
  await pintarLista();
}

async function pintarLista(){
  $('panelTitulo').classList.remove('hide');   // las vistas de avance lo ocultan
  const {data,error}=await SB.rpc('kimun_prof_listar');
  if(error) throw error;
  const porCurso={};
  (data||[]).forEach(f=>{
    porCurso[f.curso_codigo]=porCurso[f.curso_codigo]||{nombre:f.curso,alumnos:[]};
    if(f.codigo_acceso) porCurso[f.curso_codigo].alumnos.push(f);
  });
  const cursos=Object.entries(porCurso);
  $('lista').innerHTML = (cursos.length ? cursos.map(([cod,c])=>`
    <div style="margin-bottom:16px">
      <div class="cur-head">
        <b class="cur-nom" style="color:var(--gold)">${esc(c.nombre)}</b>
        <code>${esc(cod)}</code>
        <button class="ico ico-del delcurso" data-cod="${esc(cod)}" title="Eliminar curso">🗑️</button>
      </div>
      <button class="btn-chip avance" data-cod="${esc(cod)}" data-nom="${esc(c.nombre)}"
        >📊 Ver avance del curso</button>
      ${c.alumnos.length ? c.alumnos.map(a=>`
        <div class="alu">
          <div class="alu-top">
            <span>${esc(a.avatar)}</span><b class="alu-nom">${esc(a.alumno)}</b>
            <button class="ico xp" data-cod="${esc(a.codigo_acceso)}" data-xp="${esc(a.xp)}"
                    title="Fijar XP" style="color:var(--gold)">✎</button>
            <button class="ico avalum" data-cod="${esc(a.codigo_acceso)}"
                    data-nom="${esc(a.alumno)}" title="Ver avance">📊</button>
            <button class="ico ico-del del" data-cod="${esc(a.codigo_acceso)}"
                    title="Eliminar alumno">✕</button>
          </div>
          <div class="alu-sub"><code>${esc(a.codigo_acceso)}</code> · ${esc(a.xp)} XP</div>
        </div>`).join('')
       : '<p style="color:var(--dim);font-size:12px">Sin alumnos todavía.</p>'}
      <div style="margin-top:8px">
        <input class="in-alumno" data-curso="${esc(cod)}" placeholder="Nombre del alumno nuevo">
        <button class="btn sec add-alumno" data-curso="${esc(cod)}">+ Agregar alumno</button>
      </div>
    </div>`).join('')
   : '<p style="color:var(--dim);font-size:13px">Aún no tienes cursos.</p>')
   + `<div style="margin-top:10px;border-top:1px solid #ffffff22;padding-top:12px">
        <input id="cursoNombre" placeholder="Nombre del curso nuevo (8° A)">
        <button class="btn sec" id="btnCurso">+ Crear curso</button>
      </div>`;
  conectarAcciones();

  if(YO.es_admin){
    $('lista').insertAdjacentHTML('beforeend', `
      <div style="margin-top:16px;border-top:2px solid var(--violet);padding-top:12px">
        <h3 style="color:var(--violet);font-size:15px;margin:0 0 10px">Administración</h3>
        <input id="nuevoCorreo" type="email" placeholder="Correo del profesor nuevo">
        <button class="btn sec" id="btnAutorizar">+ Autorizar profesor</button>
        <div id="profes" style="margin:10px 0"></div>
        <button class="btn sec" id="btnLimpiar">🧹 Limpiar perfiles de prueba</button>
        <button class="btn sec" id="btnTablero">📊 Tablero de avance</button>
      </div>`);
    $('btnAutorizar').onclick=async ()=>{
      const c=($('nuevoCorreo').value||'').trim();
      if(!c){ aviso('Escribe un correo.'); return; }
      await accion(()=>SB.rpc('kimun_prof_autorizar',{p_correo:c}), 'Correo autorizado');
    };
    $('btnTablero').onclick=()=>{ window.location.href='dev/tablero.html'; };
    $('btnLimpiar').onclick=limpiarPruebas;
    const {data:profes,error:errProfes}=await SB.rpc('kimun_prof_profesores');
    if(errProfes){
      $('profes').innerHTML='<p style="color:var(--pink);font-size:12px">No se pudo cargar la lista de profesores.</p>';
    }else{
      $('profes').innerHTML=(profes||[]).map(p=>
        `<div style="display:flex;gap:8px;padding:4px 0;font-size:13px">
           <span class="pro-nom">${esc(p.correo)}</span>
           <span style="color:var(--dim)">${p.registrado?esc(p.nombre||'sin nombre'):'sin registrar'}</span>
           <span style="color:var(--cyan)">${p.cursos} curso${p.cursos===1?'':'s'}</span>
         </div>`).join('');
    }
  }
}

function conectarAcciones(){
  $('btnCurso').onclick=async ()=>{
    const n=($('cursoNombre').value||'').trim();
    if(!n){ aviso('Escribe un nombre.'); return; }
    await accion(()=>SB.rpc('kimun_prof_curso_crear',{p_nombre:n}), 'Curso creado');
  };
  document.querySelectorAll('.add-alumno').forEach(b=>b.onclick=async ()=>{
    const campo=document.querySelector('.in-alumno[data-curso="'+b.dataset.curso+'"]');
    const n=(campo.value||'').trim();
    if(!n){ aviso('Escribe un nombre.'); return; }
    await accion(()=>SB.rpc('kimun_prof_alumno_agregar',
      {p_curso_codigo:b.dataset.curso,p_nombre:n,p_avatar:'🦊'}), 'Alumno agregado');
  });
  document.querySelectorAll('.xp').forEach(b=>b.onclick=async ()=>{
    const v=prompt('XP de este alumno:', b.dataset.xp);
    if(v===null) return;
    if(!/^\d+$/.test(v.trim())){ aviso('Escribe un número entero de 0 o más.'); return; }
    await accion(()=>SB.rpc('kimun_prof_xp_fijar',
      {p_codigo_acceso:b.dataset.cod,p_xp:parseInt(v,10)}), 'XP actualizado a '+parseInt(v,10));
  });
  document.querySelectorAll('.del').forEach(b=>b.onclick=async ()=>{
    if(!confirm('¿Eliminar a este alumno?\n\nPierde su lugar en el ranking y sus duelos. No se puede deshacer.')) return;
    await accion(()=>SB.rpc('kimun_prof_alumno_quitar',{p_codigo_acceso:b.dataset.cod}), 'Alumno eliminado');
  });
  document.querySelectorAll('.delcurso').forEach(b=>b.onclick=async ()=>{
    if(!confirm('¿Eliminar este curso?\n\nSe borran también todos sus alumnos y sus duelos. No se puede deshacer.')) return;
    await accion(()=>SB.rpc('kimun_prof_curso_quitar',{p_curso_codigo:b.dataset.cod}), 'Curso eliminado');
  });
  document.querySelectorAll('.avance').forEach(
    b=>b.onclick=()=>verAvance(b.dataset.cod, b.dataset.nom));
  document.querySelectorAll('.avalum').forEach(
    b=>b.onclick=()=>verAvanceAlumno(b.dataset.cod, b.dataset.nom));
}

/* ===== Avance por objetivo de aprendizaje ===== */

// El límite se dice con todas sus letras en las dos vistas: el dato viaja desde el
// teléfono del alumno, así que es una brújula para decidir qué repasar, no una nota.
const AVISO_NO_CALIFICA = 'El porcentaje es del <b>primer intento</b>: cuántos acertaron la '+
  'primera vez que vieron ese contenido. <b>No sirve para calificar:</b> el dato lo reporta '+
  'el teléfono del alumno. Ten en cuenta que, con cuatro opciones por pregunta, responder '+
  'al azar da 25%.';

// Encabezado que acompaña el desplazamiento: dice de quién es la tabla y deja el camino
// de vuelta siempre a mano. El título del panel ("Mis cursos") se oculta mientras tanto,
// porque aquí ya no describe lo que se está mirando.
function cabeceraAvance(titulo, sub){
  $('panelTitulo').classList.add('hide');
  return `<div class="av-head">
    <button class="ico" id="btnVolverCab" title="Volver">←</button>
    <div style="min-width:0">
      <b class="av-head-tit">${esc(titulo)}</b>
      <div class="av-head-sub">${esc(sub)}</div>
    </div>
  </div>`;
}

const SIN_DATOS_ASIG =
  '<p style="color:var(--dim);font-size:13px">Esta asignatura todavía no tiene datos.</p>';
const ASIG_NOMBRE = {HI08:'Historia', MA08:'Matemáticas', CN08:'Ciencias', LE08:'Lenguaje'};
const ASIG_ORDEN  = ['HI08','MA08','CN08','LE08'];

// Filtro por asignatura. Con una sola asignatura no filtra nada y solo ocupa pantalla,
// así que no se dibuja.
function filtrosAsignatura(data){
  const hay = new Set(data.map(f => String(f.oa).slice(0,4)));
  const asigs = ASIG_ORDEN.filter(a => hay.has(a));
  if(asigs.length < 2) return '';
  return `<div class="av-filtros">
    <button class="av-chip on" data-asig="">Todas</button>
    ${asigs.map(a=>`<button class="av-chip" data-asig="${a}">${ASIG_NOMBRE[a]}</button>`).join('')}
  </div>`;
}

// Reparte a los alumnos del curso en cuatro grupos por su última entrada. La ventana es
// móvil (7 días hacia atrás), no "desde el lunes", para no depender de la zona horaria del
// servidor. "Nunca canjearon" se separa de "dejaron de jugar" porque la acción es distinta:
// volver a entregar el código, no insistirle al niño.
const PART_DIAS = 7;
function gruposParticipacion(filas){
  const g = {semana:[], viejo:[], sinJugar:[], sinCodigo:[]};
  const corte = Date.now() - PART_DIAS*24*60*60*1000;
  (filas||[]).forEach(f => {
    if(!f.vinculado){ g.sinCodigo.push(f); return; }
    if(!f.visto){ g.sinJugar.push(f); return; }
    (new Date(f.visto).getTime() >= corte ? g.semana : g.viejo).push(f);
  });
  return g;
}

// El bloque va plegado, con el titular en la línea visible: es el dato que hay que ver sin
// abrir nada. Se pinta primero con "Cargando…" y se rellena aparte, para no retrasar el mapa.
function bloqueParticipacionHTML(){
  return `<details id="partBloque" style="margin-bottom:12px;border:1px solid #ffffff22;
            border-radius:12px;padding:8px 10px">
    <summary style="cursor:pointer;list-style:none;color:var(--cyan);font-size:13px"
             id="partTitular">Participación · cargando…</summary>
    <div id="partCuerpo" style="padding-top:6px"></div>
  </details>`;
}

function pintarParticipacion(filas){
  const g = gruposParticipacion(filas);
  const total = (filas||[]).length;
  $('partTitular').textContent =
    `Participación · ${g.semana.length} de ${total} jugaron esta semana`;
  $('partCuerpo').innerHTML =
      grupoFichas('Jugaron esta semana', g.semana, 'var(--green)', false, '')
    + grupoFichas('Hace más de una semana', g.viejo, 'var(--gold)', false, '')
    + grupoFichas('Canjearon su código pero no han jugado', g.sinJugar, 'var(--dim)', true, '')
    + grupoFichas('Nunca canjearon su código', g.sinCodigo, 'var(--pink)', true,
        'Puede ser un código perdido o mal escrito, o que no tengan teléfono. La acción '
        + 'es volver a entregar el código. El dato lo reporta el teléfono: no es asistencia.')
    + (total ? '' : '<p style="color:var(--dim);font-size:12px">Este curso no tiene alumnos inscritos.</p>');
}

// Se lanza sin await desde verAvance: el mapa no la espera y su fallo no impide ver el
// avance. Si falla, el bloque lo dice y el mapa queda intacto.
async function cargarParticipacion(cursoCodigo){
  try{
    const {data,error} = await SB.rpc('kimun_prof_participacion',{p_curso_codigo:cursoCodigo});
    if(error) throw error;
    pintarParticipacion(data);
  }catch(e){
    const t = $('partTitular'); if(t) t.textContent = 'Participación · no se pudo cargar';
  }
}

// Cablea los chips. El filtro elegido se devuelve por callback, porque cada vista
// repinta cosas distintas.
function conectarFiltros(alCambiar){
  document.querySelectorAll('#lista .av-chip').forEach(chip => chip.onclick = () => {
    document.querySelectorAll('#lista .av-chip')
      .forEach(o => o.classList.toggle('on', o === chip));
    alCambiar(chip.dataset.asig || '');
    // La tabla nueva es más corta que la anterior: el punto donde estaba el profesor
    // ya no existe, así que se vuelve al principio en vez de dejarlo en el vacío.
    irArriba();
  });
}

// Carga perezosa: cada objetivo pide sus alumnos la primera vez que se abre. Con 50
// objetivos, pedirlos por adelantado serían 50 llamadas para algo que casi nunca se mira
// entero. Se vuelve a cablear cada vez que el filtro repinta el cuerpo.
function conectarFilasOA(cursoCodigo){
  document.querySelectorAll('#avCuerpo .oa-fila').forEach(det => det.addEventListener('toggle', async () => {
    if(!det.open || det.dataset.cargado) return;
    det.dataset.cargado = '1';
    const caja = det.querySelector('.oa-detalle');
    // Se limpia el mensaje del intento anterior: si no, al reabrir tras un fallo el
    // profesor sigue leyendo el error viejo mientras la consulta ya va en camino.
    caja.textContent = 'Cargando…';
    try{
      const {data,error} = await SB.rpc('kimun_prof_dominio_oa',
        {p_curso_codigo:cursoCodigo, p_oa:det.dataset.oa});
      if(error) throw error;
      caja.innerHTML = detalleApoyo(data);
    }catch(e){
      det.dataset.cargado = '';          // permite reintentar cerrando y abriendo
      caja.textContent = esNoAutorizado(e)
        ? 'No tienes permiso para esto, o el curso ya no existe.'
        : 'No se pudo cargar. Cierra y vuelve a abrir.';
    }
  }));
}

// Tabla de dominio, ordenada de peor a mejor: lo que hay que reforzar queda arriba.
// El servidor ya la devuelve en ese orden, así que no se reordena.
async function verAvance(cursoCodigo, cursoNombre){
  aviso('Cargando…','var(--dim)');
  try{
    const {data,error}=await SB.rpc('kimun_prof_dominio',{p_curso_codigo:cursoCodigo});
    if(error) throw error;
    const titulo = cursoNombre || cursoCodigo;
    if(!data || !data.length){
      $('lista').innerHTML = cabeceraAvance(titulo, 'Avance por objetivo')
        + bloqueParticipacionHTML() + `
        <p style="color:var(--dim);font-size:13px">
        Todavía no hay datos de avance de este curso. Aparecen cuando los alumnos juegan las campañas.</p>
        <button class="btn sec" id="btnVolverPanel">← Volver</button>`;
      $('btnVolverCab').onclick = volverAlPanel;
      $('btnVolverPanel').onclick = volverAlPanel;
      cargarParticipacion(cursoCodigo);
      irArriba(); aviso(''); return;
    }
    await cargarTextosOA(data.map(f => f.oa));
    $('lista').innerHTML = cabeceraAvance(titulo, 'Avance por objetivo')
      + bloqueParticipacionHTML() + `
      <p style="color:var(--dim);font-size:12px;margin-bottom:10px">
        Porcentaje de acierto por objetivo, de menor a mayor. ${AVISO_NO_CALIFICA}</p>
      ${filtrosAsignatura(data)}
      <div id="avCuerpo"></div>
      <p style="color:var(--dim);font-size:11px;margin-top:12px">
        Matemáticas no aparece aquí: se juega como Reto de Cálculo, con operaciones que se
        generan al momento y no están asociadas a un objetivo del currículum.</p>
      <div style="margin-top:14px">
        <button class="btn sec" id="btnReiniciarMed">🔄 Reiniciar mediciones</button>
        <button class="btn sec" id="btnVolverPanel">← Volver</button>
      </div>`;
    $('btnVolverCab').onclick = volverAlPanel;
    $('btnVolverPanel').onclick = volverAlPanel;
    $('btnReiniciarMed').onclick = () => reiniciarMediciones(cursoCodigo, cursoNombre);
    cargarParticipacion(cursoCodigo);

    let filtro = '';                                  // '' = todas las asignaturas
    const pintarCuerpo = () => {
      const filas = filtro ? data.filter(f => String(f.oa).slice(0,4) === filtro) : data;
      $('avCuerpo').innerHTML = filas.length ? bloquesAvance(filas) : SIN_DATOS_ASIG;
      conectarFilasOA(cursoCodigo);
    };
    conectarFiltros(a => { filtro = a; pintarCuerpo(); });
    pintarCuerpo();
    irArriba();
    aviso('');
  }catch(e){ aviso(errorPanel(e)); }
}

async function verAvanceAlumno(codigoAcceso, alumnoNombre){
  aviso('Cargando…','var(--dim)');
  try{
    const {data,error}=await SB.rpc('kimun_prof_dominio_alumno',{p_codigo_acceso:codigoAcceso});
    if(error) throw error;
    const titulo = alumnoNombre || codigoAcceso;
    if(!data || !data.length){
      $('lista').innerHTML = cabeceraAvance(titulo, 'Avance por objetivo') + `
        <p style="color:var(--dim);font-size:13px">
        Este alumno todavía no tiene datos. Aparecen cuando juega las campañas.</p>
        <button class="btn sec" id="btnVolverPanel">← Volver</button>`;
      $('btnVolverCab').onclick = volverAlPanel;
      $('btnVolverPanel').onclick = volverAlPanel;
      irArriba(); aviso(''); return;
    }
    await cargarTextosOA(data.map(f => f.oa));
    $('lista').innerHTML = cabeceraAvance(titulo, 'Avance por objetivo') + `
      <p style="color:var(--dim);font-size:12px;margin-bottom:10px">
        Objetivos de este alumno, de menor a mayor acierto. ${AVISO_NO_CALIFICA}</p>
      ${filtrosAsignatura(data)}
      <div id="avCuerpo"></div>
      <button class="btn sec" id="btnVolverPanel" style="margin-top:14px">← Volver</button>`;
    $('btnVolverCab').onclick = volverAlPanel;
    $('btnVolverPanel').onclick = volverAlPanel;

    let filtro = '';
    const pintarCuerpo = () => {
      const filas = filtro ? data.filter(f => String(f.oa).slice(0,4) === filtro) : data;
      $('avCuerpo').innerHTML = filas.length ? filas.map(filaAvance).join('') : SIN_DATOS_ASIG;
      // Aquí la fila NO se despliega: esta vista es de un solo alumno, así que no hay
      // grupos que mostrar. Sin esto quedaría un desplegable con "Cargando…" para siempre.
      document.querySelectorAll('#avCuerpo .oa-fila').forEach(det => {
        det.querySelector('summary').style.cursor = 'default';
        det.addEventListener('click', e => e.preventDefault());   // no despliega
        // Como no se puede desplegar, el recorte a dos líneas dejaría los textos largos
        // truncados para siempre; en esta vista se muestran enteros.
        const t = det.querySelector('.oa-texto'); if(t) t.classList.remove('oa-texto');
        const d = det.querySelector('.oa-detalle'); if(d) d.remove();
      });
    };
    conectarFiltros(a => { filtro = a; pintarCuerpo(); });
    pintarCuerpo();
    irArriba();
    aviso('');
  }catch(e){ aviso(errorPanel(e)); }
}

// Una fila del mapa. El porcentaje es el del PRIMER intento: cuántos acertaron la primera
// vez que vieron ese contenido. El acumulado con reintentos se muestra aparte, como señal
// de cuánto costó, porque mezclarlos sesga el número (quien no entiende reintenta, y así
// pesa más en el promedio del curso).
function filaAvance(f){
  const r1 = Number(f.resp_1)||0, o1 = Number(f.ok_1)||0;
  const total = Number(f.respondidas)||0;
  const alumnos = Number(f.alumnos_1 != null ? f.alumnos_1 : f.alumnos)||0;
  const reintentos = Math.max(0, total - r1);
  const pct = r1 ? Math.round(o1*100/r1) : 0;
  // Cortes calibrados al piso del azar: con 4 opciones, responder sin saber da 25%.
  // Un 50% no es "la mitad": es un tercio de dominio real.
  const color = pct >= 70 ? 'var(--green)' : pct >= 45 ? 'var(--gold)' : 'var(--pink)';
  // En la vista de curso el respaldo son los alumnos; en la de un alumno concreto no hay
  // tal conteo, así que se muestran sus preguntas de primer intento.
  const base = alumnos ? `${alumnos} alumno${alumnos===1?'':'s'}`
             : r1     ? `${r1} pregunta${r1===1?'':'s'}`
             : 'sin primer intento';
  const detalle = base + (reintentos ? ` · ${reintentos} reintento${reintentos===1?'':'s'}` : '');
  // El detalle se pide al abrir, no al cargar la tabla: con 50 objetivos serían 50
  // llamadas por adelantado para algo que casi nunca se mira entero.
  const idOa = String(f.oa).replace(/[^A-Za-z0-9]/g,'');
  return `<details class="oa-fila" data-oa="${esc(f.oa)}" id="oa-${idOa}"
                   style="padding:8px 0;border-bottom:1px solid #ffffff14">
    <summary style="cursor:pointer;list-style:none">
      <div class="oa-texto">${esc(OA_TEXTO[f.oa]||f.oa)}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;height:8px;background:#ffffff14;border-radius:4px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${color}"></div>
        </div>
        <b style="color:${color};min-width:42px;text-align:right">${pct}%</b>
        <small style="color:var(--dim);min-width:120px;text-align:right">${detalle}</small>
      </div>
    </summary>
    <div class="oa-detalle" style="padding-top:6px;color:var(--dim);font-size:12px">Cargando…</div>
  </details>`;
}

// Reparte a los alumnos de un objetivo en cuatro grupos. Los umbrales son los mismos que
// los colores del mapa (45 y 70), que ya están calibrados al piso del azar.
// "Sin evidencia" recoge a quienes no lo jugaron y a quienes tienen menos de 4 preguntas
// de primer intento: con una sola pregunta —caso típico de un jefe final, donde cae una de
// cada objetivo— un alumno queda en 0% o 100%, y mandarlo al refuerzo por eso sería una
// decisión injusta tomada sobre nada.
const APOYO_MIN_PREGUNTAS = 4;
function gruposApoyo(filas){
  const g = {apoyo:[], camino:[], logrado:[], sinDatos:[]};
  (filas||[]).forEach(f => {
    const r1 = Number(f.resp_1)||0, o1 = Number(f.ok_1)||0;
    if(r1 < APOYO_MIN_PREGUNTAS){ g.sinDatos.push(f); return; }
    const pct = o1*100/r1;
    if(pct <  45) g.apoyo.push(f);
    else if(pct < 70) g.camino.push(f);
    else g.logrado.push(f);
  });
  return g;
}

// Los nombres van como fichas en línea: 35 alumnos en columna serían cuatro pantallas
// en un teléfono. Sin porcentaje individual, a propósito: esta vista sirve para armar un
// grupo de refuerzo, no para comparar niños entre sí.
function fichasAlumnos(filas){
  return filas.map(f =>
    `<span style="display:inline-block;background:#ffffff14;border-radius:12px;
                  padding:3px 9px;margin:2px 3px 2px 0;font-size:12px">
       ${esc(f.avatar||'🦊')} ${esc(f.alumno)}</span>`).join('');
}

// Un grupo de alumnos como fichas dentro de un <details>. Compartido por la vista de
// apoyo (por objetivo) y por la de participación (por curso).
function grupoFichas(titulo, lista, color, plegado, nota){
  return !lista.length ? '' : `
    <details ${plegado?'':'open'} style="margin:6px 0 6px 10px">
      <summary style="color:${color};font-size:12px;cursor:pointer;padding:3px 0">
        ${titulo} (${lista.length})</summary>
      <div style="padding:4px 0">${fichasAlumnos(lista)}</div>
      ${nota?`<p style="color:var(--dim);font-size:11px;margin:2px 0 0">${nota}</p>`:''}
    </details>`;
}

function detalleApoyo(filas){
  const g = gruposApoyo(filas);
  return grupoFichas('Necesitan apoyo', g.apoyo, 'var(--pink)', false, '')
       + grupoFichas('En camino', g.camino, 'var(--gold)', false, '')
       + grupoFichas('Lo lograron', g.logrado, 'var(--green)', true, '')
       + grupoFichas('Todavía sin evidencia', g.sinDatos, 'var(--dim)', true,
               'No lo han jugado, o respondieron muy pocas preguntas para saberlo.');
}

// Separa por base en vez de atenuar. Ordenar de peor a mejor y a la vez atenuar las bases
// pequeñas se peleaba: la posición decía "mira esto primero" y la opacidad decía "ignora
// esto", de modo que la primera fila podía ser justo la menos confiable.
function bloquesAvance(data){
  const conBase = data.filter(f => (Number(f.alumnos_1)||0) >= 10);
  const sinBase = data.filter(f => (Number(f.alumnos_1)||0) <  10);
  const pctDe = f => (Number(f.resp_1)||0) ? (Number(f.ok_1)||0)*100/(Number(f.resp_1)||1) : 0;
  const reforzar = conBase.filter(f => pctDe(f) <  70);
  const bien     = conBase.filter(f => pctDe(f) >= 70);
  const seccion = (titulo, filas, plegada) => !filas.length ? '' : `
    <details ${plegada?'':'open'} style="margin-bottom:10px">
      <summary style="color:var(--cyan);font-size:13px;cursor:pointer;padding:6px 0">
        ${titulo} (${filas.length})</summary>
      ${filas.map(filaAvance).join('')}
    </details>`;
  return seccion('Para reforzar', reforzar, false)
       + seccion('Van bien', bien, false)
       + seccion('Todavía con pocos datos', sinBase, true);
}

async function reiniciarMediciones(cursoCodigo, cursoNombre){
  if(!confirm('¿Reiniciar las mediciones de este curso?\n\n'+
    'Los porcentajes vuelven a cero y se empieza a medir de nuevo. Sirve al comenzar una '+
    'unidad o un semestre. No se borra ningún alumno ni su XP, pero las mediciones '+
    'anteriores no se pueden recuperar.')) return;
  try{
    const {error}=await SB.rpc('kimun_prof_dominio_reiniciar',{p_curso_codigo:cursoCodigo});
    if(error) throw error;
    await verAvance(cursoCodigo, cursoNombre);
    aviso('Mediciones reiniciadas','var(--green)');
  }catch(e){ aviso(errorPanel(e)); }
}

// Ejecuta una acción, informa y refresca la lista. Centraliza el manejo de errores:
// supabase-js no lanza excepción cuando la función SQL falla, devuelve {data, error}.
async function accion(fn, exito){
  try{
    const {error}=await fn();
    if(error) throw error;
    await pintarLista();
    aviso(exito,'var(--green)');
  }catch(e){
    aviso(errorPanel(e));                   // ver el comentario de errorPanel
    try{ await pintarLista(); }catch(_){}   // refresca para mostrar la realidad
  }
}

async function limpiarPruebas(){
  try{
    const {data:n,error}=await SB.rpc('kimun_prof_limpiar_pruebas',{p_ejecutar:false});
    if(error) throw error;
    if(!n){ aviso('No hay perfiles de prueba','var(--green)'); return; }
    if(!confirm('Se van a borrar '+n+' perfil'+(n===1?'':'es')+' de prueba.\n\n'+
      'Son los que se crean solos cuando alguien abre el juego y nunca escribió un código de alumno.\n\n'+
      'También se pierden sus duelos. No se borran los alumnos inscritos ni los rivales de práctica.\n\n¿Continuar?')) return;
    const {data:b,error:e2}=await SB.rpc('kimun_prof_limpiar_pruebas',{p_ejecutar:true});
    if(e2) throw e2;
    await pintarLista();
    aviso('Se borraron '+b+' perfil'+(b===1?'':'es')+' de prueba','var(--green)');
  }catch(e){ aviso(traducir(e)); }
}

// Volver arriba. Aparece solo cuando hay trecho que subir: una tabla de 60 objetivos
// mide varias pantallas, y el encabezado pegado no basta para alcanzar los filtros.
(function(){
  const btn = $('btnArriba');
  const revisar = () => btn.classList.toggle('hide', window.scrollY < 600);
  window.addEventListener('scroll', revisar, {passive:true});
  btn.onclick = irArriba;
  revisar();
})();

// Si ya había sesión abierta, entrar directo al panel
(async ()=>{
  const {data:{session}}=await SB.auth.getSession();
  if(session){ try{ await cargarPanel(); }catch(e){ await manejarFalloDeIngreso(e); } }
})();
</script>
